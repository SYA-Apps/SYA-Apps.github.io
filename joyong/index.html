  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!-- 📦 앱 파일을 폰에 붙들어 두는 캐시(web/sw.js · 2026-09-30 땀방울에서 옮겨 옴).
       번호(B)는 배포 때 tool/stamp_web.py 가 main.dart.js 지문으로 바꿔 넣는다.
       🚨 **안 바꿨으면(밑줄로 시작) 캐시를 켜지 않는다** — 번호가 그대로면 새 판을 영영 못 알아채서다.
       그때는 오늘까지와 똑같이(캐시 없이) 돈다. -->
  <script>
    (function () {
      var B = 'b3e51057fc33';
      if (!('serviceWorker' in navigator) || B.charAt(0) === '_') return;
      // 새 판이 깔려 기다리면 띠를 띄우고, 사람이 누를 때만 바꾼다(2026-10-01 ADMIN · 판이 섞이지 않게)
      var asked = false;
      // 띠 겉모양 — 조용조용 스타일(2026-10-01 ADMIN 지시서 웹-새판-띠-꾸밈 · 고운돋움 · 밤 남색)
      var T = {
        font: 'assets/assets/fonts/GowunDodum-Regular.ttf',
        icon: '🤫', title: '새 판이 나왔어요', sub: '살짝 눌러서 바꿔요', btn: '바꾸기',
        bg: '#2B3A67', fg: '#FFE8D1', subc: '#C9D1EA', accent: '#FFE8D1', accentFg: '#2B3A67', ring: '#3A4B7E'
      };
      function offer(w) {
        if (!w || !navigator.serviceWorker.controller || document.getElementById('sya-update')) return;
        if (!document.getElementById('sya-update-css')) {
          var st = document.createElement('style');
          st.id = 'sya-update-css';
          st.textContent =
            "@font-face{font-family:'SyaUpd';src:url('" + T.font + "');font-display:swap}" +
            '#sya-update{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;' +
            'transform:translate(-50%,140%);width:calc(100% - 28px);max-width:480px;box-sizing:border-box;' +
            'display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:1px solid ' + T.ring + ';' +
            'border-radius:20px;background:' + T.bg + ';color:' + T.fg + ';text-align:left;cursor:pointer;' +
            "font-family:'SyaUpd',system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);" +
            'transition:transform .45s cubic-bezier(.2,.9,.3,1.2);-webkit-tap-highlight-color:transparent}' +
            '#sya-update.on{transform:translate(-50%,0)}' +
            '#sya-update .i{flex:0 0 42px;height:42px;border-radius:50%;background:' + T.ring + ';display:grid;place-items:center;font-size:22px}' +
            '#sya-update .t{flex:1;min-width:0;line-height:1.3}' +
            '#sya-update .t b{display:block;font-weight:normal;font-size:17px}' +
            '#sya-update .t small{display:block;font-size:13px;color:' + T.subc + '}' +
            '#sya-update .b{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:' + T.accent + ';color:' + T.accentFg + ';font-size:15px}' +
            '#sya-update .s{display:inline-block;width:14px;height:14px;border:2px solid ' + T.accentFg + ';border-right-color:transparent;' +
            'border-radius:50%;animation:syaspin .8s linear infinite;vertical-align:-2px}' +
            '@keyframes syaspin{to{transform:rotate(360deg)}}' +
            '@media (prefers-reduced-motion:reduce){#sya-update{transition:none}#sya-update .s{animation:none}}';
          document.head.appendChild(st);
        }
        var bar = document.createElement('button');
        bar.id = 'sya-update';
        bar.type = 'button';
        bar.setAttribute('aria-label', T.title + ' — ' + T.sub);
        bar.innerHTML = '<span class="i" aria-hidden="true"></span><span class="t"><b></b><small></small></span><span class="b"></span>';
        bar.querySelector('.i').textContent = T.icon;
        bar.querySelector('b').textContent = T.title;
        bar.querySelector('small').textContent = T.sub;
        bar.querySelector('.b').textContent = T.btn;
        bar.onclick = function () {
          if (asked) return;
          asked = true;
          bar.querySelector('b').textContent = '바꾸는 중이에요…';
          bar.querySelector('small').textContent = '잠깐이면 돼요';
          bar.querySelector('.b').innerHTML = '<span class="s"></span>';
          w.postMessage({ skip: true });
        };
        document.body.appendChild(bar);
        requestAnimationFrame(function () { requestAnimationFrame(function () { bar.classList.add('on'); }); });
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (asked) location.reload(); });
      navigator.serviceWorker.register('sw.js?b=' + B).then(function (reg) {
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
        });
      }).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
