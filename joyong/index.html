<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/joyong/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="조용조용 - 소리 신호등">

<!-- 카톡·메신저 링크 미리보기(Open Graph). 이미지는 절대 주소여야 한다. make_og.py 가 넣었다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="조용조용">
<meta property="og:title" content="조용조용 · 소리 신호등">
<meta property="og:description" content="소리가 커지면 화면 색과 그림으로 알려 줘요. 녹음하지 않고 크기만 재요.">
<meta property="og:url" content="https://sya-apps.github.io/joyong/">
<meta property="og:image" content="https://sya-apps.github.io/joyong/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="조용조용 — 쉿 하는 얼굴">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="조용조용">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>조용조용 - 소리 신호등</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 첫 화면 로딩 표시 (2026-09-29 · ADMIN 조각을 가져옴) — 첫 방문에 2~3MB 를 받는 동안
       흰 화면만 보이면 안 열리는 것으로 읽힌다. 첫 화면(멈춰 있어요)과 같은 남색이라 넘어갈 때 번쩍이지 않는다.
       첫 프레임이 그려지면 스스로 사라진다. -->
  <style>
    #sya-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#2B3A67;color:#d9deea;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      transition:opacity .25s ease}
    #sya-splash img{width:84px;height:84px;border-radius:21px}
    #sya-splash .bar{width:124px;height:4px;border-radius:99px;background:#3d4c7c;overflow:hidden}
    #sya-splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#d9deea;
      animation:sya-slide 1.1s ease-in-out infinite}
    @keyframes sya-slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  </style>
  <div id="sya-splash">
    <img src="icons/Icon-192.png" alt="">
    <div>불러오는 중…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!-- 📦 앱 파일을 폰에 붙들어 두는 캐시(web/sw.js · 2026-09-30 땀방울에서 옮겨 옴).
       번호(B)는 배포 때 tool/stamp_web.py 가 main.dart.js 지문으로 바꿔 넣는다.
       🚨 **안 바꿨으면(밑줄로 시작) 캐시를 켜지 않는다** — 번호가 그대로면 새 판을 영영 못 알아채서다.
       그때는 오늘까지와 똑같이(캐시 없이) 돈다. -->
  <script>
    (function () {
      var B = 'f31fef016b7d';
      if (!('serviceWorker' in navigator) || B.charAt(0) === '_') return;
      navigator.serviceWorker.register('sw.js?b=' + B).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
