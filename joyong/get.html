<!DOCTYPE html>
<!--
  쉿조용히(Shh Light) 받기 페이지 - 「친구에게 추천하기」 글에 들어가는 링크 하나.
    https://sya-apps.github.io/joyong/get.html
  안드로이드: 1.5초 뒤 Google Play 로 자동 이동(+ 단추 둘) / 아이폰·아이패드: 자동 이동 없음, 안내 그림을 읽을 시간 / PC: 1.5초 뒤 웹으로
  주소 뒤 ?stay 를 붙이면 자동 이동을 끈다(시험용). 기기 언어가 한국어가 아니면 영어로 보인다.
  카톡 미리보기는 아래 og 태그를 쓴다(Play 주소는 카톡이 미리보기를 못 만들어서 이 페이지가 대신한다).
  본보기: 학원시간표 get.html · 디자인은 이 앱 것(옅은 회색 바탕 · 남색 · 고운돋움)
  사용자에게 보이는 글에는 「」만 쓰고 « » · 가운뎃점 · 긴 줄표는 쓰지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쉿조용히 받기</title>
  <meta name="description" content="소리가 커지면 화면이 신호등처럼 알려 주는 앱이에요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="쉿조용히">
  <meta property="og:title" content="쉿조용히 - 소리 신호등">
  <meta property="og:description" content="소리가 커지면 화면 색과 그림으로 알려 줘요. 누르면 바로 받아요.">
  <meta property="og:image" content="https://sya-apps.github.io/joyong/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="쉿조용히 앱 아이콘">
  <meta property="og:url" content="https://sya-apps.github.io/joyong/get.html">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    @font-face{font-family:"Gowun Dodum";src:url("assets/assets/fonts/GowunDodum-Regular.ttf") format("truetype");font-display:swap}
    :root{--paper:#F6F5F2; --card:#FFFFFF; --ink:#2B3A67; --soft:#6B7390; --brand:#2B3A67; --on:#FFFFFF; --line:#E1E3EC}
    @media (prefers-color-scheme:dark){
      :root{--paper:#171B2C; --card:#222844; --ink:#E6E9F5; --soft:#A8AFCB; --brand:#9FB0EA; --on:#171B2C; --line:#32395A}
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);
      font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;text-align:center}
    main{max-width:420px;margin:0 auto;padding:56px 20px 40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px 22px}
    .icon{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px}
    h1{font-size:1.65rem;margin:0 0 6px;font-weight:400}
    .lead{margin:0 0 18px;color:var(--soft);font-size:1.02rem;line-height:1.5}
    #msg{min-height:1.5em;margin:0 0 16px;color:var(--soft);font-size:.95rem;line-height:1.5}
    .btn{display:block;text-decoration:none;background:var(--brand);color:var(--on);border-radius:16px;
      padding:15px 14px;margin:10px 0;font-size:1.05rem;font-family:inherit}
    .btn.sub{background:transparent;color:var(--ink);border:1.5px solid var(--brand)}
    #guide{display:none;margin-top:16px}
    #guide img{width:100%;height:auto;border-radius:14px;display:block}
    .foot{margin-top:18px;font-size:.8rem;color:var(--soft)}
  </style>
</head>
<body>
<main>
  <div class="card">
    <img class="icon" src="icons/Icon-192.png" alt="" width="96" height="96">
    <h1 id="name">쉿조용히</h1>
    <p class="lead" id="lead">소리가 커지면 화면이<br>신호등처럼 알려 줘요</p>
    <p id="msg"></p>
    <a id="go" class="btn" href="./"></a>
    <a id="alt" class="btn sub" href="./" style="display:none"></a>
    <div id="guide">
      <img src="https://sya-apps.github.io/guide/ios-add-to-home.png" alt=""
           onerror="this.parentNode.style.display='none';document.getElementById('guideText').style.display='block'">
    </div>
    <p id="guideText" class="foot" style="display:none"></p>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script>
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var iphone = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var stay = /[?&]stay/.test(location.search);
  var en = !/^ko/i.test(navigator.language || 'ko');
  var play = 'https://play.google.com/store/apps/details?id=com.sya.joyong';
  var web = 'https://sya-apps.github.io/joyong/';
  function $(i){return document.getElementById(i)}
  var go = $('go'), alt = $('alt'), msg = $('msg');
  var T = en ? {
    name:'Shh Light', lead:'The screen turns like a traffic light<br>when it gets loud', title:'Get Shh Light',
    foot:'No sign-up. It measures loudness only and never records.', gt:'Tap Share, then Add to Home Screen, to use it like an app.',
    a:'You are on Android. Get the app on Google Play.', ag:'Get it on Google Play', aa:'Try the web version first',
    i:'You are on iPhone. Open the web version, then add it to your Home Screen to use it like an app.', ig:'Open the web version',
    p:'You are on a computer. Opening the web version.', pg:'Open the web version'
  } : {
    name:'쉿조용히', lead:'소리가 커지면 화면이<br>신호등처럼 알려 줘요', title:'쉿조용히 받기',
    foot:'회원가입 없이 바로 써요. 녹음하지 않고 크기만 재요', gt:'사파리 아래 공유 단추를 누르고 「홈 화면에 추가」를 고르면 앱처럼 써요.',
    a:'안드로이드예요. Google Play로 가서 앱을 받아요.', ag:'Google Play에서 앱 받기', aa:'웹으로 먼저 써 보기',
    i:'아이폰이에요. 웹으로 열고 홈 화면에 추가하면 앱처럼 써요.', ig:'웹으로 열기',
    p:'컴퓨터예요. 웹으로 열어요.', pg:'웹으로 열기'
  };
  document.title = T.title; $('name').textContent = T.name; $('lead').innerHTML = T.lead;
  $('foot').textContent = T.foot; $('guideText').textContent = T.gt;
  if (android) {
    msg.textContent = T.a; go.textContent = T.ag; go.href = play;
    alt.style.display = 'block'; alt.textContent = T.aa; alt.href = web;
    if (!stay) setTimeout(function () { location.href = play; }, 1500);
  } else if (iphone) {
    /* 아이폰은 자동으로 넘기지 않는다: 안내를 읽을 시간이 필요하다 */
    msg.textContent = T.i; go.textContent = T.ig; go.href = web;
    $('guide').style.display = 'block';
  } else {
    msg.textContent = T.p; go.textContent = T.pg; go.href = web;
    if (!stay) setTimeout(function () { location.href = web; }, 1500);
  }
</script>
</body>
</html>
