<!DOCTYPE html>
<!--
  콕콕단어 받기 페이지 - 「친구에게 추천하기」 글에 들어가는 링크 하나.
    https://sya-apps.github.io/wordbook/get.html
  본보기 = 학원시간표 get.html. 디자인은 이 앱 것(크림 바탕 · 잉크 남색 · 연필 노랑 · 고운돋움).
  지금은 스토어 심사 중이라 Google Play 단추가 없다 - 공개되면 안드로이드 줄에 단추와 1.5초 자동 이동을 더한다.
  안드로이드·아이폰: 자동 이동 없음, 「웹으로 열기」 / 아이폰: 안내 그림을 페이지 안에 / PC: 1.5초 뒤 웹 / 주소 뒤 ?stay 면 이동 안 함.
  카톡 미리보기는 아래 og 태그를 쓴다.
  사용자에게 보이는 글에는 「」만 쓰고 큰따옴표 꺾쇠 · 가운뎃점 · 긴 줄표는 쓰지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>콕콕단어 받기</title>
  <meta name="description" content="단어 프린트를 찍으면 단어장이 되고, 플래시카드와 따라 쓰기로 외워요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="콕콕단어">
  <meta property="og:title" content="콕콕단어 - 찍어서 쓰고 외우는 영어 단어장">
  <meta property="og:description" content="단어 프린트를 찍으면 단어장이 되고, 플래시카드와 따라 쓰기로 외워요. 누르면 바로 열려요.">
  <meta property="og:image" content="https://sya-apps.github.io/wordbook/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="콕콕단어 공책 위 노란 새와 연필">
  <meta property="og:url" content="https://sya-apps.github.io/wordbook/get.html">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    @font-face{font-family:"Gowun Dodum";src:url("assets/assets/fonts/GowunDodum-Sodam.ttf") format("truetype");font-display:swap}
    :root{
      --paper:#FFF8EE; --card:#FFFFFF; --ink:#26324A; --soft:#6F7686; --brand:#FFC233; --on:#26324A;
      --line:#EFE6D6;
    }
    @media (prefers-color-scheme:dark){
      :root{--paper:#1B1A17; --card:#26251F; --ink:#EDEAE3; --soft:#B9B4A8; --brand:#FFC233; --on:#26324A;
        --line:#3A372E}
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);
      font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;text-align:center}
    main{max-width:420px;margin:0 auto;padding:56px 20px 40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px 22px;
      box-shadow:0 3px 10px rgba(0,0,0,.07)}
    .icon{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px}
    h1{font-size:1.65rem;margin:0 0 6px;font-weight:400}
    .lead{margin:0 0 18px;color:var(--soft);font-size:1.02rem;line-height:1.5}
    #msg{min-height:1.5em;margin:0 0 16px;color:var(--soft);font-size:.95rem;line-height:1.5}
    .btn{display:block;text-decoration:none;background:var(--brand);color:var(--on);border-radius:16px;
      padding:15px 14px;margin:10px 0;font-size:1.05rem;font-family:inherit}
    #guide{display:none;margin-top:16px}
    #guide img{width:100%;height:auto;border-radius:14px;display:block}
    .foot{margin-top:18px;font-size:.8rem;color:var(--soft)}
  </style>
</head>
<body>
<main>
  <div class="card">
    <img class="icon" src="icons/Icon-192.png" alt="콕콕단어 앱 아이콘" width="96" height="96">
    <h1>콕콕단어</h1>
    <p class="lead">단어 프린트를 찍으면<br>단어장이 되고, 쓰면서 외워요</p>
    <p id="msg">기기를 확인하고 있어요</p>
    <a id="go" class="btn" href="./">웹으로 열기</a>
    <div id="guide">
      <img src="https://sya-apps.github.io/guide/ios-add-to-home.png" alt="아이폰에서 앱처럼 쓰기 안내 그림"
           onerror="this.parentNode.style.display='none';document.getElementById('guideText').style.display='block'">
    </div>
    <p id="guideText" class="foot" style="display:none">사파리 아래 공유 단추를 누르고 「홈 화면에 추가」를 고르면 앱처럼 써요.</p>
  </div>
  <p class="foot">회원가입 없이 바로 써요</p>
</main>
<script>
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var iphone = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var stay = /[?&]stay/.test(location.search);
  var web = 'https://sya-apps.github.io/wordbook/';
  var go = document.getElementById('go'), msg = document.getElementById('msg');
  go.href = web;
  if (android) {
    msg.textContent = '안드로이드예요. 웹으로 바로 열 수 있어요.';
  } else if (iphone) {
    /* 아이폰은 자동으로 넘기지 않는다: 안내를 읽을 시간이 필요하다 */
    msg.textContent = '아이폰이에요. 웹으로 열고 홈 화면에 추가하면 앱처럼 써요.';
    document.getElementById('guide').style.display = 'block';
  } else {
    msg.textContent = '컴퓨터예요. 웹으로 열어요.';
    if (!stay) setTimeout(function () { location.href = web; }, 1500);
  }
</script>
</body>
</html>
