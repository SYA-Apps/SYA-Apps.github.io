<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dubakwi/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="두바퀴환승 - 따릉이와 지하철 잇기">

<!-- 카톡·메신저 링크 미리보기(Open Graph). 이미지는 절대 주소여야 한다. make_og.py 가 넣었다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="두바퀴환승">
<meta property="og:title" content="두바퀴환승 · 따릉이와 지하철 잇기">
<meta property="og:description" content="몇 시까지 가야 하는지 넣으면, 따릉이를 가장 많이 타면서 제시간에 닿는 길을 찾아 줘요.">
<meta property="og:url" content="https://sya-apps.github.io/dubakwi/">
<meta property="og:image" content="https://sya-apps.github.io/dubakwi/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="두바퀴환승 — 흰 자전거와 주황 앞바퀴">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="두바퀴환승">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>두바퀴환승</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 첫 화면이 뜨기 전 흰 화면 대신(공통 규칙 «웹 첫 로딩») -->
  <style>
    #sya-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#FAF9F4;color:#686C62;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      transition:opacity .25s ease}
    #sya-splash .t{font-size:22px;color:#1E231F}
    #sya-splash .bar{width:124px;height:4px;border-radius:99px;background:#E3E2D8;overflow:hidden}
    #sya-splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#2F6E45;
      animation:sya-slide 1.1s ease-in-out infinite}
    @keyframes sya-slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  </style>
  <div id="sya-splash">
    <div class="t">🚲 두바퀴환승</div>
    <div>불러오는 중…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- 🐌 앱 파일을 폰에 붙들어 두는 캐시(web/sw.js · 2026-09-30 땀방울 본보기).
       7d386db14d17 는 배포 때 tool/stamp_web.py 가 이번 빌드 지문으로 바꾼다. 안 바꾸면 캐시를 켜지 않고
       예전처럼(캐시 없이) 돈다. -->
  <script>
    (function () {
      var B = '7d386db14d17';
      if (!('serviceWorker' in navigator) || B.charAt(0) === '_') return;
      // 🔄 새 판이 기다리고 있으면 아래에 띠를 띄운다 — 누르면 새 워커로 넘기고 **통째로 다시 연다**(판이 섞이지 않게).
      //    그전엔 «앱을 완전히 닫았다 두 번 열어야» 바뀌어 폰에 옛 판이 오래 남았다(2026-10-01 사용자 «아까와 똑같은 말이 나와»)
      var asked = false;
      // 띠 겉모양 — 앱 글씨체(주아) · 앱 색(크림 바탕 · 잎새 초록) · 🚲. 동작은 그대로(playbook/templates/웹-새판-띠-꾸밈.md · 2026-10-01)
      //   🚨 주아에는 「…」 가 없다 → 말줄임표를 쓰지 않는다. 띠 글자는 tool/subset_jua.py 가 이 파일에서 읽어 담는다
      var T = {
        font: 'assets/assets/fonts/Jua-Subset.ttf',
        icon: '🚲', title: '새 길이 열렸어요!', sub: '눌러서 바로 바꿔요', btn: '바꾸기',
        bg: '#FFF9EF', fg: '#3A3530', subc: '#867D72', accent: '#3D8B5F', accentFg: '#FFFFFF', ring: '#E6F2E4'
      };
      function offer(w) {
        if (!w || !navigator.serviceWorker.controller || document.getElementById('sya-update')) return;
        if (!document.getElementById('sya-update-css')) {
          var st = document.createElement('style');
          st.id = 'sya-update-css';
          st.textContent =
            "@font-face{font-family:'SyaUpd';src:url('" + T.font + "');font-display:swap}" +
            '#sya-update{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;' +
            'transform:translate(-50%,140%);width:calc(100% - 28px);max-width:480px;box-sizing:border-box;' +
            'display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:1px solid ' + T.ring + ';' +
            'border-radius:20px;background:' + T.bg + ';color:' + T.fg + ';text-align:left;cursor:pointer;' +
            "font-family:'SyaUpd',system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);" +
            'transition:transform .45s cubic-bezier(.2,.9,.3,1.2);-webkit-tap-highlight-color:transparent}' +
            '#sya-update.on{transform:translate(-50%,0)}' +
            '#sya-update .i{flex:0 0 42px;height:42px;border-radius:50%;background:' + T.ring + ';display:grid;place-items:center;font-size:22px}' +
            '#sya-update .t{flex:1;min-width:0;line-height:1.3}' +
            '#sya-update .t b{display:block;font-weight:normal;font-size:17px}' +
            '#sya-update .t small{display:block;font-size:13px;color:' + T.subc + '}' +
            '#sya-update .b{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:' + T.accent + ';color:' + T.accentFg + ';font-size:15px}' +
            '#sya-update .s{display:inline-block;width:14px;height:14px;border:2px solid ' + T.accentFg + ';border-right-color:transparent;' +
            'border-radius:50%;animation:syaspin .8s linear infinite;vertical-align:-2px}' +
            '@keyframes syaspin{to{transform:rotate(360deg)}}' +
            '@media (prefers-reduced-motion:reduce){#sya-update{transition:none}#sya-update .s{animation:none}}';
          document.head.appendChild(st);
        }
        var bar = document.createElement('button');
        bar.id = 'sya-update';
        bar.type = 'button';
        bar.setAttribute('aria-label', T.title + ' ' + T.sub);
        bar.innerHTML = '<span class="i" aria-hidden="true"></span><span class="t"><b></b><small></small></span><span class="b"></span>';
        bar.querySelector('.i').textContent = T.icon;
        bar.querySelector('b').textContent = T.title;
        bar.querySelector('small').textContent = T.sub;
        bar.querySelector('.b').textContent = T.btn;
        bar.onclick = function () {
          if (asked) return;
          asked = true;
          bar.querySelector('b').textContent = '바꾸는 중이에요';
          bar.querySelector('small').textContent = '잠깐이면 돼요';
          bar.querySelector('.b').innerHTML = '<span class="s"></span>';
          w.postMessage({ skip: true });
        };
        document.body.appendChild(bar);
        requestAnimationFrame(function () { requestAnimationFrame(function () { bar.classList.add('on'); }); });
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (asked) location.reload(); });
      navigator.serviceWorker.register('sw.js?b=' + B).then(function (reg) {
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
        });
      }).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>
</body>
</html>
