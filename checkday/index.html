<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/checkday/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="체크데이 - 주간 숙제 체크">

<!-- 카톡·메신저 링크 미리보기(Open Graph). 이미지는 절대 주소여야 한다. make_og.py 가 넣었다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="체크데이">
<meta property="og:title" content="체크데이 · 매주 숙제 체크">
<meta property="og:description" content="매주 하는 숙제를 한 번만 등록하면, 아이는 체크하고 도장을 모아요.">
<meta property="og:url" content="https://sya-apps.github.io/checkday/">
<meta property="og:image" content="https://sya-apps.github.io/checkday/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="체크데이 — 체크 카드와 별 도장">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="체크데이">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>체크데이</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
