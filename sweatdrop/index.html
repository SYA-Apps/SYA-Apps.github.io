<!DOCTYPE html>
<html>
<head>
  <!-- 🛡️ `//sweatdrop/` 처럼 빗금 둘로 들어오면 Flutter 가 history.replaceState 에서
       SecurityError 로 멈춘다(회색 화면). 맨 먼저 빗금 하나로 고쳐 다시 연다.
       경위: C:\SYA\playbook\함정-모음.md 2026-09-11 «빗금이 두 개» -->
  <script>if(location.pathname.indexOf('//')===0)location.replace(location.pathname.replace(/^\/+/,'/')+location.search+location.hash);</script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/sweatdrop/">

  <meta charset="UTF-8">
  <!-- 로딩 표시가 처음부터 제 크기로 — Flutter 는 이 줄을 엔진이 뜬 뒤에야 넣어서, 그 전엔 아이폰이 980px 로 그려 아이콘이 작게 보였다가 커진다(2026-09-29) -->
  <!-- 🔒 확대를 **처음부터** 막는다(2026-09-30). 아이폰에서 폰을 가로로 돌리면 확대·밀림이 남아
       **그려진 자리와 눌리는 자리가 어긋났다**(사용자 «사진 없이 등록 자리를 눌러야 사진 찍기가 나와»).
       값은 Flutter 가 나중에 넣는 것과 똑같이 둔다 — 엔진이 이 줄을 갈아 끼울 때 달라지는 것이 없게. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="하루 10초, 운동했다 버튼 하나">

<!-- 카톡·메신저 링크 미리보기(Open Graph). 이미지는 절대 주소여야 한다(2026-09-12 추가). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="땀방울">
<meta property="og:title" content="땀방울 · 하루 10초 운동 인증">
<meta property="og:description" content="하루 10초, 운동했다 버튼 하나. 친구들과 나누고 연속일수로 힘을 얻는 운동 습관 앱.">
<meta property="og:url" content="https://sya-apps.github.io/sweatdrop/">
<meta property="og:image" content="https://sya-apps.github.io/sweatdrop/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="땀방울 — 웃는 물방울">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
  <!-- 🌗 낮/밤 — **이게 없으면 위쪽이 뿌옇게 번진다**(2026-09-21 아이폰에서 실제로 그랬다).
       사파리는 이 세 가지가 없으면 «이 페이지는 밝다» 고 보고, 화면 맨 위(상태 바 뒤)를
       **밝게 칠한 뒤 그 위에 흐림 효과를 겹친다.** 그래서 어두운 앱 내용과 만나는 자리가
       회색으로 번진 띠가 된다. 기기·iOS 판에 따라 보이기도 안 보이기도 한다.

       셋이 각각 하는 일이 다르다 — 하나만 넣으면 덜 고쳐진다:
        · color-scheme : «이 페이지는 낮·밤 둘 다 된다» 고 알린다. 이게 있어야 브라우저가
                         제 기본 색(스크롤바·빈 영역)을 밤에 맞춘다
        · theme-color  : 브라우저 **자기 UI**(상태 바 뒤·주소창)를 칠하는 색.
                         media 를 붙여 낮/밤 두 벌을 준다
        · background   : 플러터가 그리기 **전**과 화면 밖 여백의 색.
                         비워 두면 흰색이라 밤에 첫 프레임이 하얗게 번쩍인다
       🚨 색 값은 `lib/shared/tokens.dart` 의 `T.bg`(낮 #F1F0F5 · 밤 #17161C)와 **같아야 한다.**
          토큰을 바꾸면 여기도 바꿀 것 — 다르면 이 띠가 다시 생긴다. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F0F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17161C">
  <style>
    html, body { margin: 0; background: #F1F0F5; }
    /* 페이지 자체는 절대 밀리지 않게 — 밀리면 화면은 그대로인데 손가락 자리만 어긋난다(2026-09-30) */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #17161C; }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="땀방울">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>땀방울</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 첫 화면 로딩 표시 (2026-09-29 · ADMIN 제안, 나란히 것을 옮김) — 첫 방문에 몇 MB 를 받는 동안
       흰 화면만 보이면 안 열리는 것으로 읽힌다. 첫 프레임이 그려지면 스스로 사라진다.
       배경색은 위 html/body 와 같게(밝게 #F1F0F5 · 어둡게 #17161C) — 사라질 때 깜빡이지 않게. -->
  <style>
    #sya-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#F1F0F5;color:#6b6874;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      transition:opacity .25s ease}
    #sya-splash img{width:84px;height:84px;border-radius:21px}
    #sya-splash .bar{width:124px;height:4px;border-radius:99px;background:#e2e0e8;overflow:hidden}
    #sya-splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#9a96a6;
      animation:sya-slide 1.1s ease-in-out infinite}
    @keyframes sya-slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
    @media (prefers-color-scheme: dark){#sya-splash{background:#17161C;color:#b3afbd}
      #sya-splash .bar{background:#2c2a33}}
  </style>
  <div id="sya-splash">
    <img src="icons/Icon-192.png" alt="">
    <div>불러오는 중…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!-- 📦 앱 파일을 폰에 붙들어 두는 캐시(web/sw.js · 2026-09-30 «로딩은 아직도 느려»).
       번호(B)는 배포 때 tool/stamp_web.py 가 main.dart.js 지문으로 바꿔 넣는다.
       🚨 **안 바꿨으면(밑줄로 시작) 캐시를 켜지 않는다** — 번호가 그대로면 새 판을 영영 못 알아채서다.
       그때는 오늘까지와 똑같이(캐시 없이) 돈다. -->
  <script>
    (function () {
      var B = '77d15d9cd9f3';
      if (!('serviceWorker' in navigator) || B.charAt(0) === '_') return;
      navigator.serviceWorker.register('sw.js?b=' + B).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 📱 돌린 직후 아이폰이 남기는 밀림을 되돌린다(2026-09-30). 회전 애니메이션이 끝나는 시점이
       기기마다 달라 몇 번 나눠 맞춘다. 이미 0 이면 아무 일도 안 일어난다. -->
  <script>
    (function () {
      function reset() { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }
      function later() { reset(); setTimeout(reset, 150); setTimeout(reset, 500); }
      addEventListener('orientationchange', later);
      addEventListener('resize', later);
      if (window.visualViewport) visualViewport.addEventListener('resize', later);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
